[package]
name = "fuzzyplot"
version = "0.1.3"
authors = ["Autumn! <autumnull@protonmail.com>"]
license = "AGPL-3.0-or-later"
description = "A fuzzier graph plotting method"
readme = "README.md"
homepage = "https://github.com/autumnull/fuzzyplot"
repository = "https://github.com/autumnull/fuzzyplot"
keywords = ["math", "graph", "plot", "equation", "fuzzy"]
categories = ["command-line-utilities", "mathematics"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastrand = "2.5.0"
image = "0.25.10"
num-complex = "0.4.6"

[profile.release]
lto = true
codegen-units = 1
